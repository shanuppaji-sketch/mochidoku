<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7ece8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mochidoku</title>
<style>
:root{--bg:#f7ece8;--ink:#7a4545;--card:#fff;--bad:#d9363e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",sans-serif;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 12px calc(14px + env(safe-area-inset-bottom));gap:10px}
header{width:100%;display:flex;align-items:center;justify-content:space-between}
.stat{text-align:center;font-weight:600;font-size:15px;opacity:.85}
.stat b{display:block;font-size:26px;opacity:1}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:20px;box-shadow:0 2px 6px #0001}
#lives{background:var(--card);border-radius:20px;padding:4px 14px;font-size:22px;letter-spacing:4px;box-shadow:0 2px 6px #0001}
#lives .lost{opacity:.2;filter:grayscale(1)}
#rules{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;background:var(--card);border-radius:14px;padding:8px}
#rules div{font-size:12.5px;line-height:1.25;text-align:center;background:#faf3f0;border-radius:10px;padding:8px 4px}
#chips{display:flex;gap:6px;justify-content:center;background:var(--card);border-radius:16px 16px 0 0;padding:6px 12px;margin-bottom:-10px}
.chip{width:26px;height:26px;border-radius:9px 9px 6px 6px;display:flex;align-items:center;justify-content:center;opacity:.35}
.chip.done{opacity:1}
.chip .dog{font-size:18px}
#board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:var(--card);padding:6px;border-radius:14px;box-shadow:0 2px 8px #0001}
.c{border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.c{container-type:inline-size}
.c .dog{font-size:66cqw}
.c .x{width:55%;height:55%}
.c.bad{animation:shake .35s}
.c.flash{animation:flash .5s 3}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes flash{50%{filter:brightness(1.5) saturate(.6);transform:scale(.88)}}
.c.pop .dog{animation:pop .3s}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
#power{display:flex;gap:28px;margin-top:6px}
.pw{position:relative}
.pw button{width:68px;height:68px;font-size:30px}
.pw span{position:absolute;top:-4px;right:-6px;background:#e5484d;color:#fff;font-size:13px;font-weight:700;border-radius:12px;min-width:24px;text-align:center;padding:2px 6px}
.pw.zero button{opacity:.4}
#msg{min-height:20px;font-size:14px;text-align:center}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);text-align:center;padding:26px 30px}
dialog::backdrop{background:#0006}
dialog button{margin-top:14px;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;background:#f4a066;color:#fff}
.dog{display:block;line-height:1;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="round" id="newBtn" title="New puzzle">↻</button>
    <div class="stat">Level<b id="level"></b></div>
    <div class="stat">Score<b id="score"></b></div>
    <button class="round" id="resetBtn" title="Restart this puzzle">⟲</button>
  </header>
  <div id="lives"></div>
  <div id="rules">
    <div>1 pup per color</div>
    <div>1 pup per row &amp; column</div>
    <div>Pups can't touch</div>
  </div>
  <div id="chips"></div>
  <div id="board"></div>
  <div id="msg"></div>
  <div id="power">
    <div class="pw" id="pwCat"><button class="round" title="Place a pup for me">🐶</button><span></span></div>
    <div class="pw" id="pwHint"><button class="round" title="Show where to look">💡</button><span></span></div>
    <div class="pw" id="pwUndo"><button class="round" title="Undo last move">↩️</button><span></span></div>
  </div>
</div>
<dialog id="dlg"><div id="dlgText" style="font-size:20px;font-weight:700"></div><button id="dlgBtn"></button></dialog>
<script>
// ---gen---
const N=9;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function placeQueens(){
  const cols=[];
  (function go(r){
    if(r===N)return true;
    for(const c of shuffle([0,1,2,3,4,5,6,7,8])){
      if(cols.slice(0,r).includes(c))continue;
      if(r>0&&Math.abs(cols[r-1]-c)<=1)continue;
      cols[r]=c;
      if(go(r+1))return true;
    }
    return false;
  })(0);
  return cols;
}
function grow(cols){
  const reg=Array(N*N).fill(-1);
  cols.forEach((c,r)=>{reg[r*N+c]=r});
  let left=N*N-N;
  while(left>0){
    const opts=Array.from({length:N},()=>[]);
    for(let i=0;i<N*N;i++){
      if(reg[i]<0)continue;
      const r=i/N|0,c=i%N;
      for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const rr=r+dr,cc=c+dc;
        if(rr<0||cc<0||rr>=N||cc>=N)continue;
        if(reg[rr*N+cc]<0)opts[reg[i]].push(rr*N+cc);
      }
    }
    const live=opts.map((o,g)=>o.length?g:-1).filter(g=>g>=0);
    const g=live[Math.random()*live.length|0];
    const cell=opts[g][Math.random()*opts[g].length|0];
    reg[cell]=g;left--;
  }
  return reg;
}
function countSolutions(reg,limit){
  let n=0;const cols=[];
  (function go(r,colMask,regMask){
    if(n>=limit)return;
    if(r===N){n++;return}
    for(let c=0;c<N;c++){
      if(colMask>>c&1)continue;
      if(r>0&&Math.abs(cols[r-1]-c)<=1)continue;
      const g=reg[r*N+c];
      if(regMask>>g&1)continue;
      cols[r]=c;
      go(r+1,colMask|1<<c,regMask|1<<g);
    }
  })(0,0,0);
  return n;
}
// does region h stay one connected piece if cell `skip` is removed from it?
function connectedWithout(reg,h,skip){
  const cells=[];for(let i=0;i<N*N;i++)if(reg[i]===h&&i!==skip)cells.push(i);
  if(!cells.length)return false;
  const seen=new Set([cells[0]]),q=[cells[0]];
  while(q.length){
    const i=q.pop(),r=i/N|0,c=i%N;
    for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=N||cc>=N)continue;
      const k=rr*N+cc;
      if(k!==skip&&reg[k]===h&&!seen.has(k)){seen.add(k);q.push(k)}
    }
  }
  return seen.size===cells.length;
}
// nudge region borders (never the pup cells) until only one solution is left
function repair(reg,sol){
  let cur=countSolutions(reg,40);
  for(let it=0;it<1500&&cur>1;it++){
    const i=Math.random()*81|0;
    if(sol.includes(i))continue;
    const r=i/N|0,c=i%N,opts=new Set();
    for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=N||cc>=N)continue;
      if(reg[rr*N+cc]!==reg[i])opts.add(reg[rr*N+cc]);
    }
    if(!opts.size)continue;
    const old=reg[i];
    if(!connectedWithout(reg,old,i))continue;
    const g=[...opts][Math.random()*opts.size|0];
    reg[i]=g;
    const n=countSolutions(reg,40);
    if(n<=cur)cur=n;else reg[i]=old;
  }
  return cur===1;
}
function makePuzzle(){
  for(;;){
    const cols=placeQueens(),sol=cols.map((c,r)=>r*N+c);
    const reg=grow(cols);
    if(repair(reg,sol))return{reg,sol};
  }
}
// ---/gen---

const COLORS=['#e0b83a','#c84a5c','#6fb6e0','#3fb2a0','#b3e08f','#f4a6cf','#f4a066','#8a63c9','#a9bdd4'];
const KEY='mochidoku-v2', LIVES=3, SCORE_CAT=1000;
const $=s=>document.querySelector(s);
// The pup is the same 🐶 as the bottom button
const DOG='<span class="dog">🐶</span>';
const XS=c=>'<svg class="x" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="'+c+'" stroke-width="3.6" stroke-linecap="round"/></svg>';

// mk: 0 empty, 1 X, 2 pup, 3 wrong guess
let S;
function fresh(level,pw){
  const p=makePuzzle();
  return{reg:p.reg,sol:p.sol,mk:Array(81).fill(0),lives:LIVES,score:0,level,over:false,hist:[],
    pw:pw||{cat:3,hint:5,undo:5}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.reg&&j.reg.length===81){S=j;return true}}catch(e){}return false}
function say(t){$('#msg').textContent=t}

// ---------- board ----------
const board=$('#board'),chips=$('#chips');
for(let i=0;i<81;i++){const d=document.createElement('div');d.className='c';d.onclick=()=>tap(i);board.appendChild(d)}
for(let g=0;g<N;g++){const d=document.createElement('div');d.className='chip';d.style.background=COLORS[g];chips.appendChild(d)}

function render(pop){
  $('#level').textContent=S.level;
  $('#score').textContent=S.score;
  $('#lives').innerHTML='🦴'.repeat(S.lives)+'<span class="lost">'+'🦴'.repeat(LIVES-S.lives)+'</span>';
  [...board.children].forEach((d,i)=>{
    const g=S.reg[i],m=S.mk[i];
    d.style.background=COLORS[g];
    d.className='c'+(pop===i?' pop':'');
    d.innerHTML=m===2?DOG:m===1?XS('#fff'):m===3?XS(getComputedStyle(document.documentElement).getPropertyValue('--bad')):'';
  });
  [...chips.children].forEach((d,g)=>{
    const done=S.sol.some(i=>S.reg[i]===g&&S.mk[i]===2);
    d.classList.toggle('done',done);
    d.innerHTML=done?DOG:'';
  });
  for(const[k,id]of[['cat','#pwCat'],['hint','#pwHint'],['undo','#pwUndo']]){
    $(id+' span').textContent=S.pw[k];
    $(id).classList.toggle('zero',S.pw[k]<=0);
  }
}

// ---------- moves ----------
function push(){S.hist.push({mk:S.mk.slice(),score:S.score});if(S.hist.length>200)S.hist.shift()}

function autoX(i){
  const r=i/N|0,c=i%N,g=S.reg[i];
  for(let k=0;k<81;k++){
    if(S.mk[k]!==0)continue;
    const kr=k/N|0,kc=k%N;
    if(kr===r||kc===c||S.reg[k]===g||(Math.abs(kr-r)<=1&&Math.abs(kc-c)<=1))S.mk[k]=1;
  }
}

function placePup(i){
  if(S.sol.includes(i)){
    S.mk[i]=2;autoX(i);S.score+=SCORE_CAT;
    say('Pawsome! 🐾');
    if(S.sol.every(s=>S.mk[s]===2))return win();
    save();render(i);
  }else{
    S.mk[i]=3;S.lives--;
    if(navigator.vibrate)navigator.vibrate(120);
    say('Not there! Lost a bone 🦴');
    save();render();
    const d=board.children[i];d.classList.add('bad');
    if(S.lives<=0)lose();
  }
}

// single tap toggles ✕ on/off; a quick second tap on the same cell places a pup
let last={i:-1,t:0,prev:0};
function tap(i){
  if(S.over)return;
  const m=S.mk[i];
  if(m>=2)return;
  const now=Date.now();
  if(last.i===i&&now-last.t<320){
    S.mk[i]=last.prev;                       // undo the toggle from the first tap
    last={i:-1,t:0,prev:0};
    placePup(i);
    return;
  }
  push();
  S.mk[i]=m?0:1;
  last={i,t:now,prev:m};
  save();render();
}

function weakestRegion(){
  let best=-1,bestN=99;
  for(let g=0;g<N;g++){
    const cell=S.sol.find(i=>S.reg[i]===g);
    if(S.mk[cell]===2)continue;
    let n=0;for(let i=0;i<81;i++)if(S.reg[i]===g&&S.mk[i]===0)n++;
    if(n<bestN||(n===bestN&&Math.random()<.5)){best=g;bestN=n}
  }
  return best;
}

$('#pwCat').onclick=()=>{
  if(S.over||S.pw.cat<=0)return;
  const g=weakestRegion();if(g<0)return;
  push();S.pw.cat--;
  placePup(S.sol.find(i=>S.reg[i]===g));
};
$('#pwHint').onclick=()=>{
  if(S.over||S.pw.hint<=0)return;
  const g=weakestRegion();if(g<0)return;
  S.pw.hint--;save();render();
  say('💡 Look closely at the glowing color!');
  [...board.children].forEach((d,i)=>{if(S.reg[i]===g)d.classList.add('flash')});
};
$('#pwUndo').onclick=()=>{
  if(S.over||S.pw.undo<=0)return;
  const h=S.hist.pop();if(!h){say('Nothing to undo');return}
  S.pw.undo--;S.mk=h.mk;S.score=h.score;
  // a wrong guess keeps its cost, so keep wrong cells marked
  save();render();say('Undone ↩️');
};

function win(){
  S.over=true;S.score+=S.lives*500;save();render();
  $('#dlgText').textContent='🎉 Level '+S.level+' solved!  Score '+S.score;
  $('#dlgBtn').textContent='Next level';
  $('#dlgBtn').onclick=()=>{$('#dlg').close();S=fresh(S.level+1,S.pw);save();render();say('')};
  $('#dlg').showModal();
}
function lose(){
  S.over=true;save();
  $('#dlgText').textContent='😿 Out of bones!';
  $('#dlgBtn').textContent='Try again';
  $('#dlgBtn').onclick=()=>{$('#dlg').close();restart()};
  $('#dlg').showModal();
}
function restart(){
  S.mk=Array(81).fill(0);S.lives=LIVES;S.score=0;S.over=false;S.hist=[];
  save();render();say('');
}
$('#resetBtn').onclick=()=>{if(confirm('Restart this puzzle?'))restart()};
$('#newBtn').onclick=()=>{if(confirm('Skip to a new puzzle?')){S=fresh(S.level,S.pw);save();render();say('')}};

if(!load())S=fresh(1);
render();
say('Tap to mark ✕ · double-tap to place a pup.');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
